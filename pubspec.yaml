name: ika_polines
description: "A new Flutter project for IKA Polines."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  font_awesome_flutter: ^10.7.0  # untuk ikon media sosial
  http: ^1.2.2 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/google.jpg
    - assets/images/facebook.png
    - assets/images/instagram_icon.png
    - assets/images/Linkedin.png
    - assets/images/web.png
    - assets/images/Logo.png
    - assets/images/User_Profile.jpg
    - assets/images/google_logo.png
    - assets/images/kantor_b.jpeg
    - assets/images/kantor_c.jpg
